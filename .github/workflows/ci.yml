name: Build, Test, and Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily deterministic build, contract, package, and test verification at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check formatting
        run: ruff format --check src tests scripts

      - name: Run static analysis
        run: ruff check src tests scripts

      - name: Run deterministic Python test suite
        run: |
          pytest --collect-only -q
          pytest -q

  contract-and-package:
    name: Contracts and package
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package, build, and schema dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build twine pyyaml

      - name: Regenerate and verify 1,000-record capability roadmap
        run: |
          python scripts/generate_capability_catalog.py
          git diff --exit-code -- docs/CAPABILITY_CATALOG_500.md \
            docs/CAPABILITY_EXPANSION_500.md docs/CAPABILITY_CATALOG_1000.md

      - name: Regenerate and verify OpenAPI schema
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- docs/openapi.json

      - name: Validate machine-readable project contracts
        run: |
          python -m json.tool agent_tools/nastech_tts_tool.json >/dev/null
          python -m json.tool docs/openapi.json >/dev/null
          python scripts/validate_project_contracts.py

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: nastech-tts-distributions
          path: dist/
          if-no-files-found: error
