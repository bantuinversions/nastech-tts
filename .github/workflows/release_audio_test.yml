name: Release Audio Verification

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to verify with real local Nastech synthesis"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-nastech-audio:
    name: Real local voice and continuity fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install local runtime and verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Generate real local release voices
        run: |
          python scripts/generate_release_voice_fixtures.py --overwrite

      - name: Generate real expressive local audition
        run: |
          python scripts/generate_expressive_release_fixture.py --overwrite

      - name: Generate real 30-minute local continuity and preset auditions
        run: |
          python scripts/generate_longform_continuity_test.py \
            --target-seconds 1800 \
            --output-dir release/longform_continuity \
            --max-chunks 96 \
            --overwrite

      - name: Validate WAV format and deterministic levels
        run: |
          python scripts/validate_release_voice_fixtures.py \
            --report release/voice_fixtures/verification.json

      - name: Upload release voice fixtures
        uses: actions/upload-artifact@v7
        with:
          name: nastech-release-voice-fixtures-${{ github.ref_name }}
          path: release/voice_fixtures/
          if-no-files-found: error
          retention-days: 90

      - name: Upload expressive local evidence
        uses: actions/upload-artifact@v7
        with:
          name: nastech-release-expressive-audition-${{ github.ref_name }}
          path: |
            release/multilingual_fixtures/nastech-expressive-audition.xml
            release/multilingual_fixtures/nastech-expressive-audition.wav
            release/multilingual_fixtures/nastech-expressive-audition.manifest.json
            release/multilingual_fixtures/nastech-expressive-audition.levels.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload long-form continuity evidence
        uses: actions/upload-artifact@v7
        with:
          name: nastech-release-longform-continuity-${{ github.ref_name }}
          path: release/longform_continuity/
          if-no-files-found: error
          retention-days: 90
