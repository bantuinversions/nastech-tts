name: Prepare Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to package, for example v0.6.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and prepare draft release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build twine

      - name: Run release quality checks
        run: |
          ruff format --check src tests scripts
          ruff check src tests scripts
          pytest -q
          python scripts/generate_capability_catalog.py
          python scripts/validate_project_contracts.py
          python scripts/export_openapi.py
          git diff --exit-code -- docs/openapi.json docs/CAPABILITY_CATALOG_500.md \
            docs/CAPABILITY_EXPANSION_500.md docs/CAPABILITY_CATALOG_1000.md
          python scripts/validate_release_voice_fixtures.py

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          sha256sum dist/* > SHA256SUMS

      - name: Create GitHub draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* SHA256SUMS release/voice_fixtures/* \
            --draft \
            --generate-notes \
            --title "Nastech Compact $RELEASE_TAG"
