name: Nastech voice release tests

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice-registry:
    name: Audit every registered voice target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matrix checker
        run: python -m pip install numpy
      - name: Validate complete registry matrix
        run: |
          python scripts/test_all_registered_voices.py --list-json > voice-matrix.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('voice-matrix.json').read_text())
          assert len(rows) == 23, len(rows)
          assert {row['language'] for row in rows if row['story_available']} == {
              'en', 'lg', 'nyn', 'ach', 'teo', 'sw', 'rw', 'rn', 'ki',
              'ts', 'sn', 'ny'
          }
          for row in rows:
              if row['pack_state'] == 'no-verified-pack':
                  assert row['model_id'] is None, row
          print(f"Audited {len(rows)} registered targets; no silent substitutions allowed.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nastech-voice-registry
          path: voice-matrix.json
          if-no-files-found: error

  five-minute-voices:
    name: Five-minute ${{ matrix.language }} story
    needs: voice-registry
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language: [en, lg, nyn, ach, teo, sw, rw, rn, ki, ts, sn, ny]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local core and MMS runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install . numpy torch transformers huggingface_hub sentencepiece onnxruntime
      - name: Generate and validate native-language five-minute story
        env:
          NASTECH_ALLOW_LAZY_DOWNLOAD: '1'
          HF_HOME: ${{ runner.temp }}/huggingface
        run: |
          mkdir -p artifacts/${{ matrix.language }}
          python scripts/test_all_registered_voices.py \
            --language '${{ matrix.language }}' \
            --output-dir artifacts/${{ matrix.language }} \
            --report artifacts/${{ matrix.language }}/report.json \
            --duration-seconds 300
      - uses: actions/upload-artifact@v4
        with:
          name: nastech-five-minute-${{ matrix.language }}
          path: artifacts/${{ matrix.language }}
          if-no-files-found: error

  release-assets:
    name: Upload five-minute voice evidence to draft release
    needs: five-minute-voices
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nastech-five-minute-*
          path: release/five_minute_voice_fixtures
          merge-multiple: true
      - name: Build release evidence archive
        run: |
          test -n "$(find release/five_minute_voice_fixtures -name '*.wav' -print -quit)"
          tar -czf nastech-${GITHUB_REF_NAME}-five-minute-voice-tests.tar.gz release/five_minute_voice_fixtures
      - name: Upload evidence to the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            nastech-${GITHUB_REF_NAME}-five-minute-voice-tests.tar.gz \
            --clobber
