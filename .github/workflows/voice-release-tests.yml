name: Nastech voice release tests

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Daily language-registry, inventory, and approved native-story self-test at 03:37 UTC.
    - cron: "37 03 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice-registry:
    name: Audit every registered voice target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matrix checker
        run: python -m pip install . numpy
      - name: Generate complete registry matrix without downloading packs
        run: python scripts/test_all_registered_voices.py --list-json > voice-matrix.json
      - name: Self-audit registry, code-first labels, packs, stories, and inventory
        run: |
          python scripts/validate_language_self_test.py \
            --matrix voice-matrix.json \
            --inventory release/Nastech_TTS_All_Voices.md \
            --report language-self-test-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: nastech-voice-registry
          path: |
            voice-matrix.json
            language-self-test-report.json
          if-no-files-found: error

  story-contracts:
    name: Fast English emotion and Bantu story contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract test dependencies
        run: python -m pip install . numpy pytest
      - name: Verify all story suites without model downloads
        run: |
          pytest -q tests/test_five_minute_voice_runner.py tests/test_story_suite_contracts.py
          python -m nastech_tts.cli voices > english-voice-profiles.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("english-voice-profiles.json").read_text())
          assert payload["summary"]["selectable_profiles"] == 40
          assert payload["summary"]["verified_base_timbres"] == 10
          assert len(payload["profiles"]) == 40
          print("Verified 40 English delivery profiles over 10 local base timbres.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nastech-story-contracts
          path: english-voice-profiles.json
          if-no-files-found: error

  english-emotion-story:
    name: English emotion-rich five-minute story
    needs: [voice-registry, story-contracts]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local English runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install . numpy onnxruntime supertonic
      - name: Generate and validate emotion-rich English story
        run: |
          mkdir -p artifacts/en
          python scripts/test_all_registered_voices.py \
            --language en \
            --output-dir artifacts/en \
            --report artifacts/en/report.json \
            --duration-seconds 300
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/en/report.json").read_text())
          assert report["status"] == "passed"
          assert report["suite"] == "english-emotion-rich"
          assert report["levels"]["sample_rate_hz"] == 44100
          assert report["levels"]["duration_seconds"] >= 294
          assert {"laugh", "scream", "throatclear"} <= set(report["expressive_coverage"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nastech-five-minute-en
          path: artifacts/en
          if-no-files-found: error

  bantu-native-stories:
    name: Bantu native five-minute ${{ matrix.language }} story
    needs: [voice-registry, story-contracts]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language: [lg, nyn, ach, teo, sw, rw, rn, ki, ts, sn, ny]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local MMS runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install . numpy torch transformers huggingface_hub sentencepiece onnxruntime
      - name: Generate and validate native-language Bantu story
        env:
          NASTECH_ALLOW_LAZY_DOWNLOAD: "1"
          HF_HOME: ${{ runner.temp }}/huggingface
          LANGUAGE: ${{ matrix.language }}
        run: |
          mkdir -p "artifacts/${LANGUAGE}"
          python scripts/test_all_registered_voices.py \
            --language "${LANGUAGE}" \
            --output-dir "artifacts/${LANGUAGE}" \
            --report "artifacts/${LANGUAGE}/report.json" \
            --duration-seconds 300
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(f"artifacts/{os.environ['LANGUAGE']}/report.json").read_text())
          assert report["status"] == "passed"
          assert report["suite"] == "bantu-native-language"
          assert report["provider_route"] == "mms-lazy"
          assert report["levels"]["sample_rate_hz"] == 44100
          assert report["levels"]["duration_seconds"] >= 294
          assert report["levels"]["clipped_samples"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nastech-five-minute-${{ matrix.language }}
          path: artifacts/${{ matrix.language }}
          if-no-files-found: error

  release-assets:
    name: Upload five-minute story evidence to draft release
    needs: [english-emotion-story, bantu-native-stories]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nastech-five-minute-*
          path: release/five_minute_voice_fixtures
      - name: Build verified story evidence archive
        run: |
          test "$(find release/five_minute_voice_fixtures -name '*.wav' | wc -l)" -eq 12
          test "$(find release/five_minute_voice_fixtures -name 'report.json' | wc -l)" -eq 12
          tar -czf "nastech-${GITHUB_REF_NAME}-five-minute-story-tests.tar.gz" release/five_minute_voice_fixtures
      - name: Create the tagged GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "Nastech TTS $GITHUB_REF_NAME" \
              --generate-notes
          fi
      - name: Upload story evidence to the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "nastech-${GITHUB_REF_NAME}-five-minute-story-tests.tar.gz" \
            --clobber
