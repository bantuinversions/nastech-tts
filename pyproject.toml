[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nastech-tts"
version = "0.6.0"
description = "Nastech Compact: local expressive English TTS with Supertonic ONNX and an agent API."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Nastech"}]
keywords = ["text-to-speech", "tts", "speech", "emotion", "agent", "supertonic", "onnx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "supertonic>=1.3.1",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "PyYAML>=6.0",
  "ruff>=0.7",
  "twine>=6.0",
]

[project.urls]
Documentation = "https://example.invalid/nastech-tts"
Source = "https://example.invalid/nastech-tts"

[project.scripts]
nastech-tts = "nastech_tts.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
