schema_version: "1.2"
project:
  name: "Nastech Compact TTS"
  package: "nastech-tts"
  version: "0.12.2"
  publisher: "Nastech Research"
  repository: "https://github.com/bantuinversions/nastech-tts"
  license: "Apache-2.0"
  language_scope: "English verified locally; 60 East, Central, and Southern African regional targets with explicit evidence states and code-first labels"
runtime:
  provider_mixer: "Nastech"
  provider_catalog_size: 60
  language_registry_size: 61
  language_registry: "docs/BANTU_LANGUAGE_COVERAGE.md"
  optional_luganda_provider: "coqui-luganda-openbible"
  optional_language_pack_rule: "Optional external packs are never included in the 1 GiB Nastech Compact core measurement."
  optional_bantu_model_guide: "docs/BANTU_LOCAL_MODELS.md"
  optional_bantu_lazy_routes: 35
  optional_bantu_native_story_routes: 11
  optional_bantu_license_boundary: "MMS packs are CC-BY-NC-4.0 evaluation/non-commercial assets pending separate review."
  default_provider_id: "nastech-native-onnx"
  inference: "local-first; active provider selected explicitly"
  network_default: "disabled"
  gpu_required: false
  cloud_synthesis_required: false
  output:
    format: "WAV"
    sample_rate_hz: 44100
  cpu_profiles:
    - balanced
    - latency
    - throughput
    - auto
  hardware_auto_detection:
    endpoint_fields: "CPU count, RAM, CUDA availability, ONNX providers, precision, bounded concurrency, batch recommendation"
    device_override: "NASTECH_DEVICE=auto|cpu|gpu"
    gpu_fail_closed: true
  cross_platform:
    verified_profiles:
      - python-cpu
    planned_profiles:
      - python-cuda
      - python-tensorrt
      - windows-directml
      - intel-openvino
      - android-cpu-xnnpack
      - android-nnapi
      - ios-coreml
      - web-webgpu
    rule: "A planned profile requires real target-provider synthesis, audio validity, latency, memory, package-size, and relevant device evidence before verification."
  agent_execution:
    planning_endpoint: "/v1/agent/plan"
    streaming_endpoint: "/v1/agent/speech/stream"
    streaming_semantics: "Post-synthesis WAV chunks; not incremental model inference."
  voice_cleanup:
    processor: "nastech-local-pcm-cleanup"
    model_required: false
    supported_input: "mono signed-16-bit PCM WAV"
    operations:
      - DC offset removal
      - near-silence gate
      - peak limiting
      - edge fades
  operational_endpoints:
    - "/v1/health"
    - "/v1/capabilities"
    - "/v1/providers"
    - "/v1/providers/preflight"
    - "/v1/languages"
    - "/v1/languages/preflight"
    - "/v1/platforms"
    - "/v1/platforms/preflight"
    - "/v1/runtime/diagnostics"
    - "/v1/runtime/warmup"
    - "/v1/runtime/cache/clear"
quality:
  test_target: 135
  commands:
    lint: "make lint"
    tests: "pytest -q"
    package: "make build"
    full_verification: "make verify"
    capability_catalog: "make catalog"
    capability_roadmap_records: 1000
  automation:

    workflows:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release_audio_test.yml"
    daily_ci_utc: "03:17"
    dependency_updates: ".github/dependabot.yml"
deployment_budget:
  maximum_mib: 1024
  latest_verified_mib: 702.2
  remaining_mib: 321.8
agent_contract:
  descriptor: "agent_tools/nastech_tts_tool.json"
  openapi: "docs/openapi.json"
  capability_catalog: "docs/CAPABILITY_CATALOG_1000.md"
  capability_catalogs:
    foundation_500: "docs/CAPABILITY_CATALOG_500.md"
    expansion_500: "docs/CAPABILITY_EXPANSION_500.md"
    master_1000: "docs/CAPABILITY_CATALOG_1000.md"
  tools:
    - nastech_list_providers
    - nastech_list_languages
    - nastech_language_preflight
    - nastech_provider_preflight
    - nastech_compose_story
    - nastech_plan_speech
    - nastech_compile_speech
    - nastech_generate_speech
    - nastech_stream_speech
    - nastech_clean_wav
    - nastech_list_platforms
    - nastech_platform_preflight
    - nastech_runtime_diagnostics
    - nastech_warmup_runtime
    - nastech_clear_runtime_cache
  provider_catalog: "docs/PROVIDER_CATALOG_50.md"
  bantu_language_coverage: "docs/BANTU_LANGUAGE_COVERAGE.md"
  provider_architecture: "docs/PROVIDER_ARCHITECTURE.md"
  voice_inventory_policy: "docs/VOICE_INVENTORY.md"
  longform_continuity_evidence: "release/LONGFORM_CONTINUITY_TEST.md"
  expressive_audition_evidence: "release/multilingual_fixtures/nastech-expressive-audition.manifest.json"
  luganda_technical_preview_evidence: "release/multilingual_fixtures/nastech-luganda-adapter.manifest.json"
